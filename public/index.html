
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>BitTorrent Bridge 2.1</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px 16px 50px;
  background: #0f172a;
  color: #f8fafc;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

main {
  max-width: 680px;
  margin: auto;
}

h1 {
  font-size: 28px;
  margin: 15px 0 8px;
}

.subtitle {
  color: #94a3b8;
  line-height: 1.6;
  margin-bottom: 25px;
}

.panel {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 22px;
}

label {
  display: block;
  color: #cbd5e1;
  margin: 17px 0 8px;
}

input {
  display: block;
  width: 100%;
  padding: 15px;
  border: 1px solid #475569;
  border-radius: 12px;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

input[type=file] {
  font-size: 14px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #334155;
}

button.danger {
  background: #7f1d1d;
}

button:disabled {
  opacity: .5;
}

.status {
  padding: 14px;
  background: #0f172a;
  border-radius: 12px;
  margin-top: 15px;
  color: #cbd5e1;
  overflow-wrap: anywhere;
}

.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 15px;
  padding: 16px;
  margin-top: 14px;
}

.card h3 {
  margin: 0 0 10px;
  overflow-wrap: anywhere;
}

.muted {
  color: #94a3b8;
  font-size: 14px;
  line-height: 1.7;
}

.progress {
  height: 10px;
  background: #334155;
  border-radius: 20px;
  overflow: hidden;
  margin: 12px 0;
}

.progress div {
  height: 100%;
  width: 0;
  background: #3b82f6;
}

.file {
  padding: 12px 0;
  border-top: 1px solid #334155;
  overflow-wrap: anywhere;
}

.file button {
  font-size: 14px;
  padding: 12px;
}

h2 {
  font-size: 21px;
  margin-top: 28px;
}

.note {
  border-left: 4px solid #eab308;
  padding: 12px;
  background: #172033;
  color: #cbd5e1;
  font-size: 13px;
  line-height: 1.8;
  border-radius: 8px;
}
</style>
</head>

<body>
<main>

<h1>BitTorrent Bridge 2.1</h1>

<div class="subtitle">
Torrent取得状況を確認して、ファイルをiPhoneへ保存
</div>

<section class="panel">

<label for="token">アクセスキー</label>
<input
  id="token"
  type="password"
  autocomplete="off"
  placeholder="BRIDGE_TOKEN"
>

<div style="display:flex;gap:10px">
  <button id="saveToken">キーを保存</button>
  <button id="clearToken" class="secondary">キーを消去</button>
</div>

<label for="magnet">マグネットリンク</label>
<input
  id="magnet"
  type="url"
  placeholder="magnet:?xt=urn:btih:..."
>

<button id="addMagnet">マグネットを追加</button>

<label for="torrentFile">または .torrent ファイル</label>
<input
  id="torrentFile"
  type="file"
  accept=".torrent,application/x-bittorrent,application/octet-stream"
>

<button id="uploadTorrent">.torrentをアップロード</button>

<div class="status" id="message">
待機中
</div>

</section>

<h2>ダウンロード一覧</h2>

<button class="secondary" id="refresh">
一覧を更新
</button>

<div id="torrentList" class="muted">
読み込み中...
</div>

<div class="note">
<strong>iPhoneへの保存方法</strong><br>
ダウンロードボタンを押すとSafariでファイルを取得します。
ダウンロード後、Safariのダウンロード一覧から「ファイル」に保存してください。<br><br>
<strong>注意：</strong>
Render無料プランではサーバーの一時ファイルが再起動や再デプロイで消える場合があります。
</div>

</main>

<script>
const $ = id => document.getElementById(id);

let token = localStorage.getItem('bridge_token') || '';

$('token').value = token;

function message(text) {
  $('message').textContent = text;
}

function saveToken() {
  token = $('token').value.trim();

  if (!token) {
    message('アクセスキーを入力してください');
    return;
  }

  localStorage.setItem('bridge_token', token);
  message('アクセスキーを保存しました');
}

function clearToken() {
  localStorage.removeItem('bridge_token');
  $('token').value = '';
  token = '';
  message('アクセスキーを消去しました');
}

async function api(url, options = {}) {
  const headers = new Headers(options.headers || {});
  headers.set('x-bridge-token', token);

  const response = await fetch(url, {
    ...options,
    headers
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error || 'HTTP ' + response.status
    );
  }

  return data;
}

async function addMagnet() {
  const magnet = $('magnet').value.trim();

  if (!magnet) {
    message('マグネットリンクを入力してください');
    return;
  }

  try {
    message('マグネットを送信しています...');

    const data = await api('/api/add', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        magnetOrTorrent: magnet
      })
    });

    message('登録しました ID: ' + data.id);
    $('magnet').value = '';
    refreshStatus();

  } catch (err) {
    message('追加エラー: ' + err.message);
  }
}

async function uploadTorrent() {
  const file = $('torrentFile').files[0];

  if (!file) {
    message('先にTorrentファイルを選択してください');
    return;
  }

  try {
    message('ファイルをアップロードしています...');

    const form = new FormData();
    form.append('torrent', file, file.name);

    const data = await api('/api/add-file', {
      method: 'POST',
      body: form
    });

    message('アップロード成功 ID: ' + data.id);

    $('torrentFile').value = '';
    refreshStatus();

  } catch (err) {
    message('アップロードエラー: ' + err.message);
  }
}

function createText(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;

  if (className) {
    element.className = className;
  }

  return element;
}

async function downloadFile(id, index) {
  try {
    message('ダウンロードリンクを作成しています...');

    const data = await api('/api/ticket', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        id,
        fileIndex: index
      })
    });

    location.href = data.url;

  } catch (err) {
    message('ダウンロードエラー: ' + err.message);
  }
}

async function deleteTorrent(id) {
  if (!confirm('このTorrentを一覧から削除しますか？')) {
    return;
  }

  try {
    await api('/api/torrents/' + encodeURIComponent(id), {
      method: 'DELETE'
    });

    message('削除しました');
    refreshStatus();

  } catch (err) {
    message('削除エラー: ' + err.message);
  }
}

function renderTorrents(items) {
  const area = $('torrentList');
  area.replaceChildren();

  if (!items.length) {
    area.textContent = 'Torrentはまだ登録されていません。';
    return;
  }

  items.forEach(t => {
    const card = document.createElement('section');
    card.className = 'card';

    card.appendChild(
      createText('h3', t.name || '名前取得中...')
    );

    card.appendChild(
      createText(
        'div',
        '状態: ' + t.state,
        'muted'
      )
    );

    const progress = document.createElement('div');
    progress.className = 'progress';

    const bar = document.createElement('div');
    bar.style.width = Math.min(
      100,
      Math.max(0, t.progress)
    ) + '%';

    progress.appendChild(bar);
    card.appendChild(progress);

    card.appendChild(
      createText(
        'div',
        '進捗: ' + t.progress + '%',
        'muted'
      )
    );

    card.appendChild(
      createText(
        'div',
        'ピア: ' + t.peers +
        ' / 速度: ' +
        Math.round(t.speed / 1024) + ' KB/s',
        'muted'
      )
    );

    if (t.error) {
      card.appendChild(
        createText('div', t.error, 'muted')
      );
    }

    (t.files || []).forEach(f => {
      const file = document.createElement('div');
      file.className = 'file';

      file.appendChild(
        createText(
          'div',
          f.name + ' (' + f.progress + '%)'
        )
      );

      const btn = createText(
        'button',
        'iPhoneへダウンロード'
      );

      btn.addEventListener('click', () => {
        downloadFile(t.id, f.index);
      });

      file.appendChild(btn);
      card.appendChild(file);
    });

    const remove = createText(
      'button',
      'Torrentを削除',
      'danger'
    );

    remove.addEventListener('click', () => {
      deleteTorrent(t.id);
    });

    card.appendChild(remove);
    area.appendChild(card);
  });
}

async function refreshStatus() {
  if (!token) {
    $('torrentList').textContent =
      'アクセスキーを保存してください。';
    return;
  }

  try {
    const data = await api('/api/status');
    renderTorrents(data.torrents || []);

  } catch (err) {
    $('torrentList').textContent =
      '取得エラー: ' + err.message;
  }
}

$('saveToken').addEventListener('click', saveToken);
$('clearToken').addEventListener('click', clearToken);
$('addMagnet').addEventListener('click', addMagnet);
$('uploadTorrent').addEventListener('click', uploadTorrent);
$('refresh').addEventListener('click', refreshStatus);

refreshStatus();
setInterval(refreshStatus, 5000);
</script>

</body>
</html>
